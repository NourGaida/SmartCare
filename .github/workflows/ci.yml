name: SmartCare CI

"on": [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Fail when tests are skipped
        run: |
          skipped=$(sed -n 's/.*<testsuite[^>]* skipped="\([0-9]*\)".*/\1/p' target/surefire-reports/*.xml | awk '{s+=$1} END {print s+0}')
          echo "Skipped tests: $skipped"
          if [ "$skipped" -gt 0 ]; then
            echo "::error::$skipped test(s) were skipped; MongoDB integration tests must run in CI."
            exit 1
          fi

  frontend:
    name: Patient and supervision interfaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check required files
        run: |
          test -f frontend/patient/index.html
          test -f frontend/patient/styles.css
          test -f frontend/patient/manifest.webmanifest
          test -f frontend/supervision/index.html
          test -f frontend/supervision/styles.css
          test -f frontend/supervision/manifest.webmanifest

      - name: Check JavaScript syntax
        run: |
          node --check frontend/patient/app.js
          node --check frontend/patient/sw.js
          for file in frontend/shared/*.mjs frontend/patient/*.mjs frontend/supervision/*.mjs frontend/supervision/sw.js frontend/supervision/fixtures/*.mjs frontend/tests/*.mjs frontend/tests/fixtures/*.mjs frontend/tests/integration/*.mjs; do
            node --check "$file" || exit 1
          done

      - name: Test frontend roles, episodes and static resources
        run: node --test frontend/tests/frontend.test.mjs frontend/tests/access-demo.test.mjs

      - name: Report server access scenarios awaiting Person B
        run: node --test frontend/tests/integration/access-server.test.mjs

  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install simulator dependencies
        run: |
          python -m pip install -r IoT/simulator/requirements.txt
          python -m pip install pytest

      - name: Check simulator syntax
        run: |
          test -f IoT/simulator/simulator.py
          python -m compileall -q IoT/simulator

      - name: Test simulator scenarios
        run: python -m pytest IoT/simulator/tests -v
