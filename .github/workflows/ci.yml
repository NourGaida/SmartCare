name: SmartCare CI

"on": [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress -f middleware/pom.xml verify

      - name: Fail when tests are skipped
        run: |
          skipped=$(sed -n 's/.*<testsuite[^>]* skipped="\([0-9]*\)".*/\1/p' middleware/*/target/surefire-reports/*.xml | awk '{s+=$1} END {print s+0}')
          echo "Skipped tests: $skipped"
          if [ "$skipped" -gt 0 ]; then
            echo "::error::$skipped test(s) were skipped; MongoDB integration tests must run in CI."
            exit 1
          fi

  frontend:
    name: Frontoffice and backoffice interfaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check required files
        run: |
          test -f frontends/frontoffice/index.html
          test -f frontends/frontoffice/styles.css
          test -f frontends/frontoffice/manifest.webmanifest
          test -f frontends/backoffice/index.html
          test -f frontends/backoffice/styles.css
          test -f frontends/backoffice/manifest.webmanifest

      - name: Check JavaScript syntax
        run: |
          node --check frontends/frontoffice/app.js
          node --check frontends/frontoffice/sw.js
          for file in frontends/shared/*.mjs frontends/frontoffice/*.mjs frontends/backoffice/*.mjs frontends/backoffice/sw.js frontends/backoffice/fixtures/*.mjs frontends/tests/*.mjs frontends/tests/fixtures/*.mjs frontends/tests/integration/*.mjs; do
            node --check "$file" || exit 1
          done

      - name: Test frontend roles, episodes and static resources
        run: node --test frontends/tests/frontend.test.mjs frontends/tests/access-demo.test.mjs

      - name: Report server access scenarios awaiting Person B
        run: node --test frontends/tests/integration/access-server.test.mjs

  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install simulator dependencies
        run: |
          python -m pip install -r iot/simulator/requirements.txt

      - name: Check simulator syntax
        run: |
          test -f iot/simulator/simulator.py
          python -m compileall -q iot/simulator

      - name: Test simulator scenarios
        run: python -m unittest iot.simulator.tests.test_simulator -v
