name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install simulator dependencies
        run: python -m pip install -r SmartCare/simulator/requirements.txt
      - name: Check simulator syntax
        run: python -m compileall -q SmartCare/simulator/simulator.py
