name: SmartCare CD

on:
  workflow_run:
    workflows: ["SmartCare CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: smartcare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_HOST: ${{ secrets.AWS_HOST }}
      AWS_USER: ubuntu
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout exact commit validated by CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Refuse outdated deployment
        shell: bash
        run: |
          latest_sha="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ "$DEPLOY_SHA" != "$latest_sha" ]; then
            echo "::error::main has advanced. Refusing to deploy an older commit."
            exit 1
          fi

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build SmartCare WAR
        run: |
          mvn -B -ntp -f middleware/pom.xml clean package -DskipTests
          test -s middleware/api/target/smartcare.war

      - name: Configure verified SSH credentials
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.AWS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/smartcare_deploy"
          chmod 600 "$HOME/.ssh/smartcare_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/smartcare_deploy" > /dev/null

      - name: Copy WAR to Lightsail
        shell: bash
        run: |
          scp -i "$HOME/.ssh/smartcare_deploy" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            middleware/api/target/smartcare.war \
            "${AWS_USER}@${AWS_HOST}:/tmp/smartcare-${DEPLOY_SHA}.war"

      - name: Deploy in WildFly, verify and rollback on failure
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/smartcare_deploy" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${AWS_USER}@${AWS_HOST}" "bash -se -- '$DEPLOY_SHA'" <<'REMOTE'
          set -Eeuo pipefail
          sha="$1"
          war="/tmp/smartcare-${sha}.war"
          releases="$HOME/smartcare-releases"
          backup="$releases/backup-$(date -u +%Y%m%dT%H%M%SZ).war"
          mkdir -p "$releases"
          test -s "$war"
          sudo docker inspect smartcare-wildfly > /dev/null

          # Keep the previous WAR so it can be restored if deployment fails.
          sudo docker cp smartcare-wildfly:/tmp/smartcare.war "$backup"

          rollback() {
            echo "Deployment failed; restoring previous WAR"
            sudo docker cp "$backup" smartcare-wildfly:/tmp/smartcare.war || true
            sudo docker exec smartcare-wildfly \
              /opt/jboss/wildfly/bin/jboss-cli.sh --connect \
              --command='deploy /tmp/smartcare.war --force' || true
          }
          trap rollback ERR

          sudo docker cp "$war" smartcare-wildfly:/tmp/smartcare.war
          sudo docker exec smartcare-wildfly \
            /opt/jboss/wildfly/bin/jboss-cli.sh --connect \
            --command='deploy /tmp/smartcare.war --force'

          healthy=false
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 5 \
              http://127.0.0.1:8080/smartcare/api/health \
              | grep -q '"status":"ok"'; then
              healthy=true
              break
            fi
            sleep 3
          done
          test "$healthy" = true

          printf '%s\n' "$sha" > "$releases/current-commit.txt"
          rm -f "$war"
          trap - ERR
          echo "DEPLOYMENT SUCCESS: $sha"
