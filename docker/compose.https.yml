services:
  nginx:
    image: nginx:stable
    container_name: smartcare-nginx-https
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontends:/usr/share/nginx/html:ro
      - ../certs:/etc/nginx/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
