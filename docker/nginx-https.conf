server {
    listen 80;
    listen [::]:80;
    server_name app.smartcare.local staff.smartcare.local api.smartcare.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.smartcare.local;

    ssl_certificate /etc/nginx/certs/smartcare.local.pem;
    ssl_certificate_key /etc/nginx/certs/smartcare.local-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=300" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    location = /api {
        return 301 /api/;
    }

    location ^~ /api/ {
        proxy_pass http://host.docker.internal:8080/smartcare/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }

    location = /sw.js {
        alias /usr/share/nginx/html/frontoffice/sw.js;
        default_type application/javascript;
        types { }
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location = /manifest.webmanifest {
        alias /usr/share/nginx/html/frontoffice/manifest.webmanifest;
        default_type application/manifest+json;
        types { }
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /shared/ {
        try_files $uri =404;
    }

    location ^~ /frontoffice/ {
        try_files $uri =404;
    }

    location ^~ /backoffice/ {
        try_files $uri =404;
    }

    location ~* \.woff2$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files /frontoffice$uri =404;
    }

    location ~* \.(?:css|js|mjs|png|svg|webmanifest)$ {
        add_header Cache-Control "public, max-age=3600" always;
        try_files /frontoffice$uri =404;
    }

    location / {
        try_files /frontoffice$uri /frontoffice$uri/ /frontoffice/index.html;
        add_header Cache-Control "no-cache" always;
    }
}

